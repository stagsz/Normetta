<!-- @dsCard group="Type" viewport="700x170" name="Display — Space Grotesk" subtitle="Headings, page titles, large numerals" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 22px; background: var(--surface-card); }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-bottom: 12px; }
  .big { font-family: var(--font-display); font-weight: 600; font-size: 40px; line-height: 1.05; letter-spacing: -0.02em; color: var(--text-strong); }
  .sub { font-family: var(--font-display); font-weight: 500; font-size: 20px; color: var(--text-body); margin-top: 8px; letter-spacing:-0.01em; }
  .num { font-family: var(--font-display); font-weight: 700; font-size: 52px; color: var(--brand); letter-spacing:-0.02em; }
</style>
</head>
<body>
  <div class="meta">Space Grotesk · 500 / 600 / 700 · --font-display</div>
  <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:24px;">
    <div>
      <div class="big">Audit readiness, clear</div>
      <div class="sub">Clause 9.1 — Monitoring &amp; measurement</div>
    </div>
    <div class="num">94<span style="font-size:26px; color:var(--text-subtle)">%</span></div>
  </div>
</body>
</html>
