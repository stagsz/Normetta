<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing scale" subtitle="4px base grid · --space-1 → --space-16" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 22px; background: var(--surface-card); }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-bottom: 16px; }
  .row { display:flex; align-items:flex-end; gap: 16px; }
  .item { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .bar { background: var(--brand); border-radius: var(--radius-xs); width: 100%; }
  .lab { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); }
  .px { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-strong); font-weight:600; }
</style>
</head>
<body>
  <div class="meta">--space-* · padding · gap · margin</div>
  <div class="row">
    <div class="item"><div class="bar" style="height:4px"></div><div class="px">4</div><div class="lab">1</div></div>
    <div class="item"><div class="bar" style="height:8px"></div><div class="px">8</div><div class="lab">2</div></div>
    <div class="item"><div class="bar" style="height:12px"></div><div class="px">12</div><div class="lab">3</div></div>
    <div class="item"><div class="bar" style="height:16px"></div><div class="px">16</div><div class="lab">4</div></div>
    <div class="item"><div class="bar" style="height:24px"></div><div class="px">24</div><div class="lab">6</div></div>
    <div class="item"><div class="bar" style="height:32px"></div><div class="px">32</div><div class="lab">8</div></div>
    <div class="item"><div class="bar" style="height:40px"></div><div class="px">40</div><div class="lab">10</div></div>
    <div class="item"><div class="bar" style="height:48px"></div><div class="px">48</div><div class="lab">12</div></div>
    <div class="item"><div class="bar" style="height:64px"></div><div class="px">64</div><div class="lab">16</div></div>
  </div>
</body>
</html>
