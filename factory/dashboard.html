<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Normetta Factory</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1f; --mute:#8a8a8e; --line:#e4e4e1;
          --pass:#2f9e5b; --chg:#d9822b; --pend:#c9c9c6; --hot:#d6336c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151516; --card:#1f1f21; --ink:#ececec; --mute:#8d8d92; --line:#2e2e31; --pend:#4a4a4e; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, sans-serif; }
  header { padding:16px 20px; display:flex; gap:12px; align-items:baseline; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; }
  header span { color:var(--mute); font-size:12px; }
  .board { display:grid; grid-template-columns:repeat(6, minmax(180px,1fr)); gap:12px; padding:16px 20px; overflow-x:auto; }
  .col h2 { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); margin:0 0 8px; }
  .col.needs-human h2 { color:var(--hot); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; cursor:pointer; }
  .card:hover { border-color:var(--mute); }
  .card.hot { border:2px solid var(--hot); }
  .id { font-weight:600; font-size:13px; }
  .meta { color:var(--mute); font-size:11px; margin:2px 0 8px; font-family:ui-monospace, monospace; }
  .chips { display:flex; gap:4px; flex-wrap:wrap; }
  .chip { font-size:10px; padding:2px 6px; border-radius:10px; background:var(--pend); color:#fff; }
  .chip.PASS { background:var(--pass); } .chip.CHANGES { background:var(--chg); }
  dialog { width:min(820px,94vw); max-height:86vh; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); padding:0; }
  dialog::backdrop { background:rgba(0,0,0,.35); }
  .dh { display:flex; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--line); }
  .tabs { display:flex; gap:4px; flex-wrap:wrap; padding:8px 16px; border-bottom:1px solid var(--line); }
  .tabs button { font:inherit; font-size:12px; border:1px solid var(--line); background:none; color:var(--ink); border-radius:6px; padding:3px 8px; cursor:pointer; }
  .tabs button.on { background:var(--ink); color:var(--card); }
  pre { margin:0; padding:16px; white-space:pre-wrap; font:12.5px/1.5 ui-monospace, monospace; overflow:auto; max-height:62vh; }
  .x { border:none; background:none; color:var(--mute); font-size:18px; cursor:pointer; }
</style>
</head>
<body>
<header><h1>Normetta Factory</h1><span id="status">loading board.json…</span></header>
<main class="board" id="board"></main>
<dialog id="dlg">
  <div class="dh"><strong id="dtitle"></strong><button class="x" onclick="dlg.close()">×</button></div>
  <div class="tabs" id="tabs"></div>
  <pre id="body"></pre>
</dialog>
<script>
const STAGES = ["spec","build","review","approve","needs-human","merged"];
const REVIEWERS = ["security","ux","ui","code"];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let jobs = [];

async function poll() {
  try {
    const r = await fetch("board.json?t=" + Date.now());
    jobs = (await r.json()).jobs || [];
    render();
    status.textContent = "updated " + new Date().toLocaleTimeString();
  } catch (e) { status.textContent = "cannot read board.json — serve with python3 -m http.server"; }
}

function render() {
  board.innerHTML = STAGES.map(st => `
    <section class="col ${st}"><h2>${st}</h2>
      ${jobs.map((j,i) => [j,i]).filter(([j]) => j.stage === st).map(([j,i]) => `
        <div class="card ${st === "needs-human" ? "hot" : ""}" onclick="openJob(${i})">
          <div class="id">${esc(j.id)}</div>
          <div class="meta">${esc(j.branch || "")}${j.round ? " · round " + j.round : ""}</div>
          ${j.title ? `<div style="margin-bottom:8px">${esc(j.title)}</div>` : ""}
          <div class="chips">${REVIEWERS.map(r => {
            const v = (j.reviews || {})[r] || "pending";
            return `<span class="chip ${v}" title="${r}: ${v}">${r}</span>`;
          }).join("")}</div>
        </div>`).join("")}
    </section>`).join("");
}

async function openJob(i) {
  const j = jobs[i];
  dtitle.textContent = j.id;
  const files = j.files || ["spec.md","build.md","decision.md"];
  tabs.innerHTML = files.map(f => `<button data-f="${esc(f)}">${esc(f)}</button>`).join("");
  tabs.querySelectorAll("button").forEach(b => b.onclick = () => show(j.id, b));
  dlg.showModal();
  if (tabs.firstChild) show(j.id, tabs.firstChild);
}

async function show(id, btn) {
  tabs.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === btn));
  const r = await fetch(`jobs/${id}/${btn.dataset.f}?t=${Date.now()}`);
  body.textContent = r.ok ? await r.text() : "(not written yet)";
}

poll(); setInterval(poll, 2000);
</script>
</body>
</html>
