<!-- @dsCard group="Type" viewport="700x170" name="Mono / data — IBM Plex Mono" subtitle="Clause numbers, IDs, scores, metadata; tabular numerals" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 22px; background: var(--surface-card); }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-bottom: 14px; }
  .grid { display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px 14px; font-family: var(--font-mono); }
  .k { font-size:10px; color:var(--text-subtle); text-transform:uppercase; letter-spacing:0.06em; }
  .v { font-size:16px; color:var(--text-strong); font-weight:500; font-variant-numeric: tabular-nums; }
  .tag { display:inline-block; background:var(--brand-soft); color:var(--brand-strong); border:1px solid var(--clay-200); padding:2px 8px; border-radius:var(--radius-sm); font-size:13px; font-weight:600; }
</style>
</head>
<body>
  <div class="meta">IBM Plex Mono · --font-mono · tabular-nums</div>
  <div class="grid">
    <div><div class="k">Clause ref</div><div class="v"><span class="tag">9.1.2</span></div></div>
    <div><div class="k">Finding ID</div><div class="v">NC-2026-0184</div></div>
    <div><div class="k">Score</div><div class="v">94.0 / 100</div></div>
    <div><div class="k">Last review</div><div class="v">2026-06-02</div></div>
    <div><div class="k">Owner</div><div class="v">QHSE-04</div></div>
    <div><div class="k">Conformity</div><div class="v">87.5%</div></div>
  </div>
</body>
</html>
