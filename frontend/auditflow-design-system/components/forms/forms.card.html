<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface-card); }
  .grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 26px; align-items: start; }
  .block { display: flex; flex-direction: column; gap: 12px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-subtle); }
  .rowx { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Input, Select, Checkbox, Switch } = window.AuditFlowDesignSystem_900961;
const Gear = () => (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.5.61.85 1.12.91H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>);
const Plus = () => (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>);

function Demo() {
  return (
    <div className="grid">
      <div className="block">
        <span className="lbl">Buttons</span>
        <div className="rowx">
          <Button variant="primary" iconLeft={<Plus/>}>New assessment</Button>
          <Button variant="secondary">Export</Button>
        </div>
        <div className="rowx">
          <Button variant="ghost">Cancel</Button>
          <Button variant="danger">Reopen</Button>
          <Button variant="primary" disabled>Disabled</Button>
        </div>
        <div className="rowx">
          <Button size="sm">Small</Button>
          <Button size="md">Medium</Button>
          <Button size="lg">Large</Button>
          <IconButton label="Settings"><Gear/></IconButton>
          <IconButton label="Add" variant="primary"><Plus/></IconButton>
        </div>
        <span className="lbl" style={{marginTop:8}}>Toggles</span>
        <Checkbox label="Documented procedure exists" defaultChecked />
        <Checkbox label="Evidence attached" description="Clause 7.5 — controlled record" />
        <div className="rowx" style={{gap:18}}>
          <Switch label="Auto-flag overdue" defaultChecked />
          <Switch label="Email approver" />
        </div>
      </div>
      <div className="block">
        <span className="lbl">Inputs</span>
        <Input label="Evidence reference" placeholder="e.g. QP-7.5 Rev 4" hint="Link a controlled document" />
        <Select label="Conformity rating" placeholder="Select…" options={[
          {value:'c',label:'Conformant'},{value:'o',label:'Observation'},{value:'n',label:'Nonconformity'}
        ]} />
        <Input label="Auditor email" defaultValue="not-an-email" error="Enter a valid email address" />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
