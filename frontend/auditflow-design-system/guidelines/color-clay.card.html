<!-- @dsCard group="Colors" viewport="700x150" name="Clay — primary brand" subtitle="The Normetta terracotta ramp; 600 is the primary action color" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface-card); }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-xs); }
  .sw { flex: 1; height: 84px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 10px; }
  .sw span { font-family: var(--font-mono); font-size: 10px; line-height: 1.3; }
  .sw .n { font-weight: 600; }
  .l { color: var(--stone-900); }
  .d { color: #fff; }
  .cap { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 10px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--clay-50)"><span class="n l">50</span><span class="l">#FBF1EB</span></div>
    <div class="sw" style="background:var(--clay-100)"><span class="n l">100</span><span class="l">#F4DCCD</span></div>
    <div class="sw" style="background:var(--clay-200)"><span class="n l">200</span><span class="l">#E8B89B</span></div>
    <div class="sw" style="background:var(--clay-300)"><span class="n l">300</span><span class="l">#D89169</span></div>
    <div class="sw" style="background:var(--clay-400)"><span class="n d">400</span><span class="d">#C66E43</span></div>
    <div class="sw" style="background:var(--clay-500)"><span class="n d">500</span><span class="d">#B05630</span></div>
    <div class="sw" style="background:var(--clay-600)"><span class="n d">600●</span><span class="d">#9C4A2A</span></div>
    <div class="sw" style="background:var(--clay-700)"><span class="n d">700</span><span class="d">#7E3B22</span></div>
    <div class="sw" style="background:var(--clay-800)"><span class="n d">800</span><span class="d">#62301D</span></div>
    <div class="sw" style="background:var(--clay-900)"><span class="n d">900</span><span class="d">#4A2517</span></div>
  </div>
  <div class="cap">● --brand · primary buttons, active nav, links, focus</div>
</body>
</html>
